        <section>
            <h1>Contacto</h1>

        <!-- method="get" action="contacto.php" -->
        <section>
            <form id="formulario" class="form-control p-3">

                <div class="input-group input-group-sm mb-3">
                    <span class="input-group-text" id="inputGroup-sizing-sm">Nombre:</span>
                    <input type="text" name="nombre" class="form-control" aria-label="Sizing example input"
                        aria-describedby="inputGroup-sizing-sm">
                </div>

                <div class="input-group input-group-sm mb-3">
                    <span class="input-group-text" id="inputGroup-sizing-sm">E-mail:</span>
                    <input type="text" name="email" class="form-control" aria-label="Sizing example input"
                        aria-describedby="inputGroup-sizing-sm">
                </div>

                <label class="form-lable p-3"> Información de consulta</label>

                <div class="form-check mb-3 p-3">
                    <input class="form-check-input" type="radio" name="envio" id="radioDefault1">

                    </label>
                </div>
                <div class="form-check mb-3 p-3">
                    <input class="form-check-input" type="radio" name="pago" id="radioDefault1">

                    </label>
                </div>
                <div class="form-check mb-3 p-3">
                    <input class="form-check-input" type="radio" name="devolucion" id="radioDefault1">
                    <label class="form-check-label" for="radioDefault1">
                        Devolución
                    </label>
                </div>

                <div class="input-group mb-3 p-3">
                    <span class="input-group-text">Mensaje:</span>
                    <textarea name="mensaje" class="form-control" aria-label="With textarea"></textarea>
                </div>

                
                <input type="submit" value="Enviar" class="button btn btn-primary">
                   
                <button class="button btn btn-success" onclick="Limpar()">Limpiar Formulario</button>
                
                

            </form>
             
        </section>

    document.getElementById("formulario").reset();
}
